services:
    # Laravel приложение с PHP 8.3 и Nginx
    web:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: telegram_bot_web
        depends_on:
            mysql:
                condition: service_healthy
        working_dir: /var/www/html
        networks:
            - telegram_bot_network
        environment:
            APP_NAME: "${APP_NAME}"
            APP_ENV: "${APP_ENV}"
            APP_DEBUG: "${APP_DEBUG}"
            APP_URL: "${APP_URL}"
            DB_CONNECTION: "${DB_CONNECTION}"
            DB_HOST: "${DB_HOST}"
            DB_PORT: "${DB_PORT}"
            DB_DATABASE: "${DB_DATABASE}"
            DB_USERNAME: "${DB_USERNAME}"
            DB_PASSWORD: "${DB_PASSWORD}"
            KAFKA_BROKERS: kafka:9092
            SMTP_HOST: "${SMTP_HOST}"
            SMTP_PORT: "${SMTP_PORT}"
            SMTP_USERNAME: "${SMTP_USERNAME}"
            SMTP_PASSWORD: "${SMTP_PASSWORD}"
            TELEGRAM: "${TELEGRAM}"
            PHONE: "${PHONE}"
            EMAIL: "${EMAIL}"
            TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
            TELEGRAM_TOKEN_CHAT_ID: "${TELEGRAM_TOKEN_CHAT_ID}"
            TELEGRAM_WEB_APP_URL: "${TELEGRAM_WEB_APP_URL}"
            TELEGRAM_ADMIN_DUPLICATE: "${TELEGRAM_ADMIN_DUPLICATE}"
            TELEGRAM_ADMIN_CHAT_ID: "${TELEGRAM_ADMIN_CHAT_ID}"
            AI_TIMEWEB_API_KEY: "${AI_TIMEWEB_API_KEY}"
            AI_TIMEWEB_API_URL: "${AI_TIMEWEB_API_URL}"
            AI_TIMEWEB_API_TOKEN: "${AI_TIMEWEB_API_TOKEN}"
        ports:
            - "9000:80"
        restart: unless-stopped

    # MySQL база данных
    mysql:
        image: mysql:8.0
        container_name: telegram_bot_mysql
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
        networks:
            - telegram_bot_network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
        restart: unless-stopped

    kafka:
        image: apache/kafka:latest
        container_name: kafka
        restart: always
        ports:
            - "9092:9092"
            - "9094:9094"
        healthcheck:
            # Исправлен путь к скриптам
            test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        environment:
            # Убраны префиксы _CFG_
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: CLIENT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: CLIENT://kafka:9092,EXTERNAL://host.docker.internal:9094
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: CLIENT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
            # Тайм-ауты (опционально)
            KAFKA_REQUEST_TIMEOUT_MS: 60000
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        networks:
            - telegram_bot_network
    worker:
        build:
            context: .
            dockerfile: Dockerfile # Использует тот же Dockerfile, что и сервис web
        container_name: telegram_bot_worker
        working_dir: /var/www/html
        environment:
            APP_NAME: "${APP_NAME}"
            APP_ENV: "${APP_ENV}"
            APP_DEBUG: "${APP_DEBUG}"
            APP_URL: "${APP_URL}"
            DB_CONNECTION: "${DB_CONNECTION}"
            DB_HOST: "${DB_HOST}"
            DB_PORT: "${DB_PORT}"
            DB_DATABASE: "${DB_DATABASE}"
            DB_USERNAME: "${DB_USERNAME}"
            DB_PASSWORD: "${DB_PASSWORD}"
            KAFKA_BROKERS: kafka:9092
            SMTP_HOST: "${SMTP_HOST}"
            SMTP_PORT: "${SMTP_PORT}"
            SMTP_USERNAME: "${SMTP_USERNAME}"
            SMTP_PASSWORD: "${SMTP_PASSWORD}"
            TELEGRAM: "${TELEGRAM}"
            PHONE: "${PHONE}"
            EMAIL: "${EMAIL}"
            TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
            TELEGRAM_TOKEN_CHAT_ID: "${TELEGRAM_TOKEN_CHAT_ID}"
            TELEGRAM_WEB_APP_URL: "${TELEGRAM_WEB_APP_URL}"
            TELEGRAM_ADMIN_DUPLICATE: "${TELEGRAM_ADMIN_DUPLICATE}"
            TELEGRAM_ADMIN_CHAT_ID: "${TELEGRAM_ADMIN_CHAT_ID}"
            AI_TIMEWEB_API_KEY: "${AI_TIMEWEB_API_KEY}"
            AI_TIMEWEB_API_URL: "${AI_TIMEWEB_API_URL}"
            AI_TIMEWEB_API_TOKEN: "${AI_TIMEWEB_API_TOKEN}"
        networks:
            - telegram_bot_network
        depends_on:
            app_setup:
                condition: service_started
            kafka:
                condition: service_healthy # Ждет запуска Kafka
            # ...
        # !!! Здесь ваша команда становится основной командой контейнера !!!
        command: php artisan app:consume-telegram-updates
        restart: unless-stopped

    app_setup:
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            web:
                condition: service_started
        working_dir: /var/www/html
        environment:
            APP_NAME: "${APP_NAME}"
            APP_ENV: "${APP_ENV}"
            APP_DEBUG: "${APP_DEBUG}"
            APP_URL: "${APP_URL}"
            DB_CONNECTION: "${DB_CONNECTION}"
            DB_HOST: "${DB_HOST}"
            DB_PORT: "${DB_PORT}"
            DB_DATABASE: "${DB_DATABASE}"
            DB_USERNAME: "${DB_USERNAME}"
            DB_PASSWORD: "${DB_PASSWORD}"
            KAFKA_BROKERS: kafka:9092
            SMTP_HOST: "${SMTP_HOST}"
            SMTP_PORT: "${SMTP_PORT}"
            SMTP_USERNAME: "${SMTP_USERNAME}"
            SMTP_PASSWORD: "${SMTP_PASSWORD}"
            TELEGRAM: "${TELEGRAM}"
            PHONE: "${PHONE}"
            EMAIL: "${EMAIL}"
            TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
            TELEGRAM_TOKEN_CHAT_ID: "${TELEGRAM_TOKEN_CHAT_ID}"
            TELEGRAM_WEB_APP_URL: "${TELEGRAM_WEB_APP_URL}"
            AI_TIMEWEB_API_KEY: "${AI_TIMEWEB_API_KEY}"
            AI_TIMEWEB_API_URL: "${AI_TIMEWEB_API_URL}"
            AI_TIMEWEB_API_TOKEN: "${AI_TIMEWEB_API_TOKEN}"

        # !!! ПРАВИЛЬНАЯ КОМАНДА (без 'docker compose exec web') !!!
        command: >
            /bin/sh -c "
            php artisan migrate --force &&
            php artisan optimize:clear &&
            php artisan cache:clear &&
            php artisan config:cache &&
            php artisan db:seed --force
            "
        networks:
            - telegram_bot_network
        restart: "no"

    autoheal:
        image: willfarrell/autoheal:latest
        container_name: autoheal
        restart: always
        networks:
            - telegram_bot_network
        environment:
            - AUTOHEAL_CONTAINER_LABEL=all
networks:
    telegram_bot_network:
        driver: bridge
